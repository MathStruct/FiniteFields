name: Julia

# Runs only when a Julia package (or this workflow) changes. Every directory `julia/<Pkg>/` with
# a Project.toml is tested; while there is none, the test job is skipped.
on:
  push:
    branches: [main]
    paths:
      - "julia/**"
      - ".github/workflows/julia.yml"
  pull_request:
    paths:
      - "julia/**"
      - ".github/workflows/julia.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: julia-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          packages=$(for d in julia/*/; do [ -f "$d/Project.toml" ] && echo "${d%/}"; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Julia packages: $packages"

  test:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    name: ${{ matrix.package }} · Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
        julia: ["1", "min"]   # the current release and the oldest version in [compat]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
          project: ${{ matrix.package }}   # "min" reads julia's [compat] from this Project.toml
      - uses: julia-actions/cache@v2
      - name: Test ${{ matrix.package }}
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
